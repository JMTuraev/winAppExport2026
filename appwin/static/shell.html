<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Eksport Monitor</title>
<link rel="stylesheet" href="/static/fonts/fonts.css">
<link rel="stylesheet" href="/appwin/shell.css">
</head>
<body>
<div class="shell" id="shell">
  <!-- title bar -->
  <div class="tbar">
    <div class="brand"><div class="lg"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-7"/></svg></div><b>Eksport Monitor</b></div>
    <div class="tabs" id="tabs"></div>
    <button class="ico" id="tab-new" title="Yangi tab (Ctrl+T)" aria-label="Yangi tab"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
    <button class="ksearch" id="k-open"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg><span>Sahifa, korxona, INN…</span><span class="kbd">Ctrl K</span></button>
    <button class="ico" id="bell" title="Bildirishnomalar" aria-label="Bildirishnomalar"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 16V11a6 6 0 0 1 12 0v5l2 2H4zM10 21h4"/></svg><span class="dot" id="bell-dot" hidden></span></button>
    <button class="ume" id="ume"><span class="av" id="u-av">–</span><span><span class="nm" id="u-name">…</span><br><span class="rl" id="u-role"></span></span></button>
    <div class="wc" id="wc" hidden><button id="w-min" aria-label="Kichraytirish">–</button><button id="w-max" aria-label="Kattalashtirish">▢</button><button class="close" id="w-close" aria-label="Yopish">×</button></div>
  </div>

  <div class="body">
    <nav class="rail" id="rail" aria-label="Asosiy"></nav>
    <aside class="panel" id="panel"></aside>
    <div class="content" id="content"></div>
  </div>

  <div class="sbar" id="sbar">
    <span><span class="dot" id="s-dot"></span>Server <span class="mono" id="s-srv">…</span></span>
    <button id="s-online">… onlayn</button>
    <span id="s-data" class="dim">…</span>
    <span class="sp"></span>
    <span id="s-backup" class="dim">…</span>
    <span id="s-ver" class="dim"></span>
  </div>
</div>
<div class="toast" id="toast" role="status"></div>
<div id="overlay"></div>
<script src="/appwin/shell.js"></script>
</body>
</html>
