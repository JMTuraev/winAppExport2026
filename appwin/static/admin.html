<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Superadmin — Eksport Monitor</title>
<link rel="icon" href="/appwin/logo.svg">
<link rel="stylesheet" href="/static/fonts/fonts.css">
<style>
:root{--bg:#F4F6F5;--panel:#fff;--panel2:#EEF1EF;--line:#DCE1DD;--line2:#F1F3F2;--ink:#182029;--ink2:#5A6470;--ink3:#8A929C;--accent:#0F6E63;--accent-soft:#DDEFEB;--gold:#B7912A;--gold-soft:#F5EBCF;--ok:#2E8B57;--ok-ink:#24714A;--ok-soft:#DFF2E6;--warn-ink:#8F5E12;--warn-soft:#FBEFD6;--bad:#B23A3A;--bad-soft:#F8E0E0;--side:#14232B;--mono:"IBM Plex Mono",Consolas,monospace}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans",system-ui,"Segoe UI",Arial,sans-serif;font-size:13px;line-height:1.45}
button,input,select{font-family:inherit;font-size:inherit}button{cursor:pointer}a{color:var(--accent);text-decoration:none}
.top{background:var(--side);color:#C9D3D8;height:48px;display:flex;align-items:center;padding:0 18px;gap:14px}
.top b{color:#fff;font-size:14px}.top .sp{flex:1}.top a,.top button{color:#C9D3D8;background:transparent;border:1px solid #2B3D48;border-radius:6px;padding:5px 10px;font-size:12px}
.top a:hover,.top button:hover{background:#1C2B34;color:#fff}
.wrap{max-width:1400px;margin:0 auto;padding:18px 20px 40px}
h1{margin:0;font-size:20px;font-weight:600}
.hd1{display:flex;align-items:center;gap:12px;margin-bottom:14px}.hd1 .sp{flex:1}
.tabs{display:flex;gap:2px;background:var(--panel2);padding:3px;border-radius:8px}
.tabs button{font-size:12px;font-weight:500;padding:5px 12px;border-radius:6px;border:0;background:transparent;color:var(--ink2)}
.tabs button.on{background:#fff;color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(20,35,43,.1)}
.btn{height:32px;padding:0 13px;border-radius:8px;border:1px solid var(--line);background:#fff;color:var(--ink);font-weight:500;font-size:12px;display:inline-flex;align-items:center;gap:6px}
.btn.p{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:600}.btn.sm{height:26px;padding:0 9px;font-size:11px;border-radius:6px}.btn.bad{color:var(--bad);border-color:#EAC8C8}.btn:disabled{opacity:.5;cursor:default}
.card{background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:12px}
.card .hd{display:flex;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line2);gap:8px;flex-wrap:wrap}.card .hd h2{margin:0;font-size:13px;font-weight:600}.card .hd .sub{font-size:11px;color:var(--ink2)}.card .hd .sp{flex:1}
.tbl{width:100%;border-collapse:collapse;font-size:12px}.tbl th{font-size:10px;color:var(--ink2);font-weight:600;text-transform:uppercase;letter-spacing:.4px;text-align:left;padding:6px 10px;border-bottom:1px solid var(--line2);white-space:nowrap}
.tbl td{padding:7px 10px;border-bottom:1px solid var(--line2);vertical-align:middle}.tbl tr:last-child td{border-bottom:0}.tbl tr.dim td{color:var(--ink2);background:#FBFCFB}.tbl tr.bad td{background:#FDF3F3}
.mono{font-family:var(--mono);font-size:11px}.el{max-width:460px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{font-size:10px;font-weight:600;padding:2px 7px;border-radius:4px;white-space:nowrap}.pill.bad{color:var(--bad);background:var(--bad-soft)}.pill.warn{color:var(--warn-ink);background:var(--warn-soft)}.pill.ok{color:var(--ok-ink);background:var(--ok-soft)}.pill.acc{color:#0B564D;background:var(--accent-soft)}.pill.gold{color:#7A5E12;background:var(--gold-soft)}.pill.gray{color:var(--ink2);background:var(--panel2)}.pill.blue{color:#1F4F86;background:#E4ECF6}
.who{display:flex;align-items:center;gap:8px;font-weight:500}.av{width:24px;height:24px;border-radius:12px;background:var(--gold);color:var(--side);font-weight:700;font-size:9px;display:inline-flex;align-items:center;justify-content:center}
.on-dot{display:inline-flex;align-items:center;gap:5px}.on-dot::before{content:"";width:7px;height:7px;border-radius:4px;background:var(--ok)}.on-dot.off::before{background:#C9D3D8}.on-dot.blk::before{background:var(--bad)}
.sel,.inp{height:28px;border:1px solid var(--line);border-radius:6px;padding:0 8px;font-size:12px;background:#fff;color:var(--ink)}
.fbar{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.srvg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;padding:10px 14px;font-size:12px}.srvg .l{font-size:10px;color:var(--ink2)}
.row{display:flex;align-items:center;gap:10px;padding:8px 14px;border-bottom:1px solid var(--line2);font-size:12px}.row:last-child{border-bottom:0}.row .t{flex:1;min-width:0}.row .m{color:var(--ink2);font-size:11px}
.note{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--bg);border-radius:8px;font-size:12px;margin:12px 14px}.note.warn{background:var(--warn-soft);color:var(--warn-ink)}
.empty{padding:18px 14px;color:var(--ink2);font-size:12px;text-align:center}
.mbg{position:fixed;inset:0;background:rgba(20,35,43,.45);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px}
.mdl{background:#fff;border-radius:12px;width:min(520px,100%);box-shadow:0 24px 60px rgba(0,0,0,.35);overflow:hidden}.mdl .hd{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line2)}.mdl .hd h2{margin:0;font-size:15px;font-weight:600;flex:1}
.mdl .x{width:28px;height:28px;border:0;background:transparent;border-radius:6px;font-size:16px;color:var(--ink2)}.mdl .bd{padding:16px 18px;display:flex;flex-direction:column;gap:12px}.mdl .ft{display:flex;gap:8px;justify-content:flex-end;padding:12px 18px;border-top:1px solid var(--line2);background:#FBFCFB}
.fld{display:flex;flex-direction:column;gap:5px;font-size:12px;font-weight:500}.fld input,.fld select{height:34px;border:1px solid var(--line);border-radius:7px;padding:0 10px;font-size:13px;background:#fff}.fld .h{font-size:11px;color:var(--ink2);font-weight:400}
.f2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.chips{display:flex;flex-wrap:wrap;gap:5px}.chip{font-size:11px;font-weight:500;padding:4px 9px;border-radius:12px;background:var(--panel2);border:0;color:var(--ink)}.chip.on{background:var(--side);color:#fff}
.err{background:var(--bad-soft);color:var(--bad);border-radius:8px;padding:9px 12px;font-size:12px}
.toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:9px 14px;border-radius:8px;font-size:12px;opacity:0;transition:.2s;z-index:70;pointer-events:none}.toast.show{opacity:1;transform:translateX(-50%)}.toast.err{background:var(--bad)}
</style>
</head>
<body>
<div class="top"><svg viewBox="0 0 64 64" aria-hidden="true" width="28" height="28"><defs><linearGradient id="awg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#149B8A"/><stop offset="1" stop-color="#0B564D"/></linearGradient></defs><rect x="2" y="2" width="60" height="60" rx="14" fill="url(#awg)"/><rect x="14" y="34" width="8" height="16" rx="2.5" fill="#fff"/><rect x="28" y="22" width="8" height="28" rx="2.5" fill="#fff"/><rect x="42" y="28" width="8" height="22" rx="2.5" fill="#fff" opacity=".92"/><path d="M15 27 L30 16 L38 21 L49 12" fill="none" stroke="#F1D27A" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="49" cy="12" r="4.2" fill="#B7912A" stroke="#fff" stroke-width="1.6"/></svg><b>Eksport Monitor</b><span>Superadmin</span><span class="sp"></span><span id="me"></span><a href="/">← Saytga</a><button id="pwd">Parol</button><a href="/logout">Chiqish</a></div>
<div class="wrap">
  <div class="hd1"><h1>Superadmin</h1><span class="pill gold">faqat siz ko'rasiz</span>
    <div class="tabs" id="tabs"><button data-t="users" class="on">Foydalanuvchilar</button><button data-t="online">Hozir tizimda</button><button data-t="audit">Audit jurnali</button><button data-t="server">Zaxira va server</button></div>
    <span class="sp"></span><button class="btn p" id="add">+ Foydalanuvchi qo'shish</button></div>
  <div id="body"></div>
</div>
<div class="toast" id="toast"></div><div id="ov"></div>
<script>
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const dmy=i=>i?`${i.slice(8,10)}.${i.slice(5,7)}.${i.slice(0,4)}`:'—',hm=i=>i?i.slice(11,16):'',ini=n=>(n||'?').split(/\s+/).map(x=>x[0]).slice(0,2).join('').toUpperCase();
function toast(m,e){const t=$('#toast');t.textContent=m;t.className='toast show'+(e?' err':'');clearTimeout(t._h);t._h=setTimeout(()=>t.className='toast',e?7000:3500)}
async function api(p,b){const r=await fetch(p,b===undefined?{}:{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});const d=(r.headers.get('content-type')||'').includes('json')?await r.json():null;if(r.status===401){location.href='/login';throw new Error('login')}if(!r.ok)throw new Error((d&&d.error)||'Xato '+r.status);return d}
const ME={},A={tab:'users',users:null,f:{}},RP={superadmin:'gold',operator:'acc',viewer:'blue',district:'gray'};
function modal(h,init){const bg=document.createElement('div');bg.className='mbg';bg.innerHTML=`<div class="mdl">${h}</div>`;$('#ov').appendChild(bg);$$('[data-x]',bg).forEach(x=>x.onclick=()=>bg.remove());bg.addEventListener('keydown',e=>{if(e.key==='Escape')bg.remove()});init&&init(bg);return bg}
async function tab(){$$('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t===A.tab));const b=$('#body');b.innerHTML='<div class="empty">Yuklanmoqda…</div>';try{await({users,online,audit,server})[A.tab](b)}catch(e){b.innerHTML=`<div class="err">${esc(e.message)}</div>`}}
async function users(b){const d=await api('/api/admin/users');A.users=d;const dn=Object.fromEntries(d.districts.map(x=>[x.code,x.name_uz]));
 b.innerHTML=`<div class="card"><div class="hd"><h2>Foydalanuvchilar</h2><span class="sub">${d.users.length} ta · ${d.users.filter(u=>u.online).length} onlayn · ${d.users.filter(u=>!u.active).length} bloklangan</span></div><table class="tbl"><thead><tr><th>Xodim</th><th>Login</th><th>Rol</th><th>Tumanlar</th><th>Oxirgi kirish</th><th>Holat</th><th></th></tr></thead><tbody>
 ${d.users.map(u=>`<tr class="${u.active?'':'dim'}"><td><span class="who"><span class="av" style="${u.role==='superadmin'?'background:#14232B;color:#fff':''}">${esc(ini(u.name))}</span>${esc(u.name)}</span></td><td class="mono">${esc(u.login)}</td><td><span class="pill ${RP[u.role]||'gray'}">${esc(u.role_name)}</span>${u.must_change?' <span class="pill warn" title="Birinchi kirishda parolni o\'zgartiradi">parol</span>':''}</td>
 <td style="color:var(--ink2)">${u.role==='district'?esc(u.districts.map(c=>dn[c]||c).join(', ')||'—'):(u.role==='viewer'?'hammasi (faqat o\'qish)':'hammasi')}</td><td>${u.last_login?esc(dmy(u.last_login).slice(0,5)+' '+hm(u.last_login)):'—'}</td>
 <td><span class="on-dot ${!u.active?'blk':(u.online?'':'off')}">${!u.active?'bloklangan':(u.online?'onlayn':'oflayn')}</span></td><td style="text-align:right;white-space:nowrap"><button class="btn sm" data-e="${u.id}">Tahrir</button> ${u.id!==ME.id?`<button class="btn sm${u.active?' bad':''}" data-a="${u.id}" data-v="${u.active?0:1}">${u.active?'Bloklash':'Ochish'}</button>`:''}</td></tr>`).join('')}</tbody></table></div>`;
 $$('[data-e]',b).forEach(x=>x.onclick=()=>userModal(d.users.find(u=>u.id===+x.dataset.e)));
 $$('[data-a]',b).forEach(x=>x.onclick=async()=>{try{await api('/api/admin/user/active',{id:+x.dataset.a,active:x.dataset.v==='1'});toast(x.dataset.v==='1'?'Ochildi':'Bloklandi');tab()}catch(e){toast(e.message,true)}})}
function userModal(u){const d=A.users||{districts:[],roles:{}};const isNew=!u;const sel=new Set(u?u.districts:[]);const roles=d.roles||{};
 modal(`<div class="hd"><h2>${isNew?'Yangi foydalanuvchi':'Foydalanuvchi: '+esc(u.name)}</h2><button class="x" data-x>×</button></div><div class="bd"><div class="err" id="um-err" hidden></div>
 <div class="f2"><label class="fld">Ism familiya<input id="um-name" value="${esc(u?u.name:'')}" placeholder="Dilshod Karimov"></label><label class="fld">Login<input id="um-login" value="${esc(u?u.login:'')}" ${isNew?'':'disabled'} placeholder="d.karimov"></label></div>
 <label class="fld">Rol<select id="um-role">${Object.entries(roles).map(([k,n])=>`<option value="${k}"${u&&u.role===k?' selected':(!u&&k==='operator'?' selected':'')}>${esc(n)}</option>`).join('')}</select><span class="h" id="um-rh"></span></label>
 <div class="fld" id="um-dist"><span>Tumanlar (tuman xodimi uchun)</span><div class="chips">${d.districts.map(x=>`<button type="button" class="chip${sel.has(x.code)?' on':''}" data-c="${x.code}">${esc(x.name_uz.replace(' тумани','').replace(' шаҳри',' ш.'))}</button>`).join('')}</div></div>
 <label class="fld">${isNew?'Parol':'Yangi parol (bo\'sh qolsa o\'zgarmaydi)'}<input id="um-pwd" type="text" autocomplete="off" placeholder="kamida 6 belgi"><span class="h">Xodim birinchi kirishda parolni o'zi o'zgartiradi.</span></label></div>
 <div class="ft"><button class="btn" data-x>Bekor</button><button class="btn p" id="um-save">Saqlash</button></div>`,m=>{
 const RH={superadmin:'Hamma narsa + bu panel',operator:'GTD/jadval yuklash, korxona tahrir, Excel',viewer:'Faqat ko\'rish va Excel yuklab olish',district:'Faqat ko\'rish; o\'z tumanlari (filtr keyingi bosqichda)'};
 const rs=$('#um-role',m),rh=$('#um-rh',m),ds=$('#um-dist',m);const upd=()=>{rh.textContent=RH[rs.value]||'';ds.style.display=rs.value==='district'?'':'none'};rs.onchange=upd;upd();
 $$('.chip',m).forEach(c=>c.onclick=()=>{c.classList.toggle('on');c.classList.contains('on')?sel.add(c.dataset.c):sel.delete(c.dataset.c)});
 $('#um-save',m).onclick=async()=>{try{await api('/api/admin/user/save',{id:u?u.id:null,name:$('#um-name',m).value,login:$('#um-login',m).value,role:rs.value,districts:[...sel],password:$('#um-pwd',m).value||undefined});toast('Saqlandi');m.remove();tab()}catch(e){const er=$('#um-err',m);er.textContent=e.message;er.hidden=false}};setTimeout(()=>$('#um-name',m).focus(),50)})}
async function online(b){const d=await api('/api/admin/online');
 b.innerHTML=`<div class="card"><div class="hd"><h2>Hozir tizimda</h2><span class="sub">${d.online.length} ta · oxirgi 5 daqiqada faol</span><span class="sp"></span><button class="btn sm" id="r">Yangilash</button></div>${d.online.length?`<table class="tbl"><thead><tr><th>Xodim</th><th>Rol</th><th>IP</th><th>Kompyuter</th><th>Kirgan</th><th>Oxirgi faollik</th><th></th></tr></thead><tbody>${d.online.map(o=>`<tr><td><span class="who"><span class="av">${esc(ini(o.name))}</span>${esc(o.name)}</span></td><td><span class="pill ${RP[o.role]||'gray'}">${esc(o.role_name)}</span></td><td class="mono">${esc(o.ip||'')}</td><td class="mono">${esc(o.host||'')}</td><td>${esc(dmy(o.since).slice(0,5)+' '+hm(o.since))}</td><td>${esc(hm(o.last_seen))}</td><td style="text-align:right">${o.id!==ME.id?`<button class="btn sm" data-k="${o.id}">Sessiyani yopish</button>`:''}</td></tr>`).join('')}</tbody></table>`:'<div class="empty">Hozir hech kim yo\'q</div>'}</div>`;
 $('#r',b).onclick=()=>online(b);$$('[data-k]',b).forEach(x=>x.onclick=async()=>{try{await api('/api/admin/user/kick',{id:+x.dataset.k});toast('Sessiya yopildi');online(b)}catch(e){toast(e.message,true)}})}
async function audit(b){const f=A.f;const qs=Object.entries(f).filter(([,v])=>v).map(([k,v])=>k+'='+encodeURIComponent(v)).join('&');const d=await api('/api/admin/audit'+(qs?'?'+qs:''));const us=(A.users||(A.users=await api('/api/admin/users'))).users;
 b.innerHTML=`<div class="card"><div class="hd"><h2>Audit jurnali</h2><span class="sub">kim · qachon · qayerdan · nima qildi — ${d.total} yozuv</span><span class="sp"></span><div class="fbar"><select class="sel" id="fu"><option value="">Hamma xodimlar</option>${us.map(u=>`<option value="${u.id}"${f.user_id==u.id?' selected':''}>${esc(u.name)}</option>`).join('')}</select><select class="sel" id="fa"><option value="">Hamma harakatlar</option>${d.actions.map(a=>`<option${f.action===a?' selected':''}>${esc(a)}</option>`).join('')}</select><select class="sel" id="fo"><option value="">Hammasi</option><option value="1"${f.ok==='1'?' selected':''}>Muvaffaqiyatli</option><option value="0"${f.ok==='0'?' selected':''}>Rad etilgan / xato</option></select><input class="inp" type="date" id="f1" value="${esc(f.date_from||'')}"><input class="inp" type="date" id="f2" value="${esc(f.date_to||'')}"><input class="inp" id="ft" placeholder="matn…" value="${esc(f.text||'')}" style="width:140px"><button class="btn sm" id="go">Qidirish</button><a class="btn sm" href="/api/admin/audit.xlsx${qs?'?'+qs:''}">Excel</a></div></div>
 <table class="tbl"><thead><tr><th>Vaqt</th><th>Xodim</th><th>IP</th><th>Harakat</th><th>Tafsilot</th><th>Natija</th></tr></thead><tbody>${d.rows.map(r=>`<tr class="${r.ok?'':'bad'}"><td class="mono">${esc(dmy(r.ts).slice(0,5))} ${esc(hm(r.ts))}</td><td>${esc(r.login||'—')}</td><td class="mono" style="color:var(--ink2)">${esc(r.ip||'')}</td><td><span class="pill ${r.ok?(r.action==='kirdi'||r.action==='chiqdi'?'gray':'acc'):'bad'}">${esc(r.action)}</span></td><td class="el" title="${esc(r.path||'')}">${esc(r.detail||r.path||'')}</td><td style="color:${r.ok?'var(--ok-ink)':'var(--bad)'}">${r.ok?'✓':'✕'}</td></tr>`).join('')||'<tr><td colspan="6" class="empty">Yozuv yo\'q</td></tr>'}</tbody></table></div>`;
 const go=()=>{A.f={user_id:$('#fu',b).value,action:$('#fa',b).value,ok:$('#fo',b).value,date_from:$('#f1',b).value,date_to:$('#f2',b).value,text:$('#ft',b).value};audit(b)};$('#go',b).onclick=go;$('#ft',b).onkeydown=e=>{if(e.key==='Enter')go()};['#fu','#fa','#fo','#f1','#f2'].forEach(s=>$(s,b).onchange=go)}
async function server(b){const d=await api('/api/admin/server');let x=null;try{x=await api('/api/admin/backup')}catch(_){}
 const ext=!x||!x.configured?`<div class="note warn">Tashqi disk sozlanmagan — <b>AppWin\\config.json</b> ichida <span class="mono">"backup_dir": "E:\\\\EksportMonitor_zaxira"</span> yozing va dasturni qayta oching.</div>`
 :`<div style="padding:12px 14px;display:flex;gap:12px;align-items:center"><div style="flex:1"><div style="font-weight:600">${x.connected?'Tashqi disk ulangan':'Tashqi disk ULANMAGAN'} · ${esc(x.path)}</div><div style="font-size:11px;color:var(--ink2)">${x.connected?`bo'sh ${x.free_gb} GB · ${x.count} ta nusxa · oxirgisi ${x.last?esc(x.last.name.replace('_',' ')):'—'}`:'Diskni ulang'}</div></div><button class="btn p sm" id="xr" ${x.connected?'':'disabled'}>Hozir zaxiralash</button><button class="btn sm" id="xv" ${x.connected&&x.count?'':'disabled'}>Zaxirani tekshirish</button></div>${(x.snapshots||[]).slice(0,10).map(s=>`<div class="row"><span class="t mono">${esc(s.name.replace('_',' '))}</span><span class="m">${s.by?esc(s.by)+' · ':''}${s.mb!=null?s.mb+' MB':''}</span><span style="color:${s.ok===false?'var(--bad)':'var(--ok-ink)'}">${s.ok===false?'✕':'✓'}</span></div>`).join('')}<div id="xo" style="padding:0 14px 10px;font-size:11px;color:var(--ink2)"></div>`;
 b.innerHTML=`<div class="g2"><div class="card"><div class="hd"><h2>Tashqi disk zaxirasi</h2><span class="sub">dastur yopilganda so'raladi · 30 kun + 12 oy</span></div>${ext}</div>
 <div class="card"><div class="hd"><h2>Ichki zaxira</h2><span class="sub">${esc(d.db_path.split(/[\\/]/).slice(-2).join('/'))}</span><span class="sp"></span><button class="btn p sm" id="bn">Hozir zaxiralash</button></div><div style="padding:12px 14px"><b>Oxirgi: ${d.last_backup?esc(d.last_backup.replace('export_','').replace('.db','').replace('_',' ')):'—'}</b><div style="font-size:11px;color:var(--ink2)">baza ${d.db_mb} MB · data\\backups · har yuklashdan oldin va kuniga bir marta avtomatik; tiklash — saytda «Nazorat va tarix»</div></div>${d.backups.map(x=>`<div class="row"><span class="t mono">${esc(x.name)}</span><span class="m">${x.mb} MB</span></div>`).join('')}</div></div>
 <div class="card"><div class="hd"><h2>Server</h2></div><div class="srvg"><div><div class="l">Ofis tarmog'ida manzil</div><div class="mono">http://${esc(d.ip)}:${d.port}/</div></div><div><div class="l">Kompyuter</div><div>${esc(d.host)}</div></div><div><div class="l">Ish vaqti</div><div>${Math.floor(d.uptime_min/60)} soat ${d.uptime_min%60} daq</div></div><div><div class="l">Versiya</div><div>AppWin ${esc(d.version)} · Python ${esc(d.python)}</div></div><div><div class="l">Bugun harakatlar</div><div>${d.audit_today} · <span style="color:var(--bad)">${d.audit_denied_today} rad etilgan</span></div></div><div><div class="l">Ochiq sessiyalar</div><div>${d.sessions_open}</div></div><div><div class="l">Rejim</div><div>${d.readonly?'<span class="pill bad">faqat ko\'rish</span>':'<span class="pill ok">yozish mumkin</span>'}</div></div></div><div style="padding:0 14px 12px;font-size:11px;color:var(--ink2)">Xodimlar brauzerda shu manzilni ochadi. Kompyuter uxlab qolmasin, IP o'zgarmasin (routerda statik IP).</div></div>
 <div class="card"><div class="hd"><h2>Yangilanish</h2><span class="sub">o'rnatishsiz — GitHub'dan olib, qayta ochish</span><span class="sp"></span><button class="btn sm" id="up-chk">Tekshirish</button><button class="btn p sm" id="up-pull" disabled>Yangilash (git pull)</button><button class="btn sm bad" id="up-rst">Qayta ishga tushirish</button></div><div id="up-body" class="empty">«Tekshirish» — GitHub'dagi yangi o'zgarishlar bor-yo'qligini ko'rsatadi (internet kerak, 5–10 s).</div>
 <div style="padding:0 14px 12px;font-size:11px;color:var(--ink2)">Xodim kompyuterlaridagi dastur (client rejimi) har ochilganda o'zgargan fayllarni serverdan o'zi oladi — ularda hech narsa qilish shart emas. Fayllarni qo'lda almashtirsangiz ham «Qayta ishga tushirish» yetarli.</div></div>`;
 const upB=$('#up-body',b),upP=$('#up-pull',b);
 const drawUp=d=>{upB.className='';upB.innerHTML=d.repos.map(r=>`<div class="row"><span class="t"><b style="font-weight:600">${esc(r.name)}</b> ${r.git?`<span class="m">· ${esc(r.branch||'')} · ${esc(r.head||'')}</span>`:'<span class="pill gray">git repo emas</span>'}${r.error?`<div class="m" style="color:var(--bad)">${esc(r.error)}</div>`:''}${r.incoming&&r.incoming.length?`<div class="m" style="margin-top:4px">${r.incoming.map(esc).join('<br>')}</div>`:''}</span>${r.git?(r.behind?`<span class="pill warn">${r.behind} ta yangi</span>`:(r.fetch_ok===false?'<span class="pill bad">tekshirilmadi</span>':'<span class="pill ok">yangi</span>')):''}${r.dirty?'<span class="pill gray" title="Lokal o\'zgarishlar bor — git pull to\'xtashi mumkin">lokal o\'zgarish</span>':''}</div>`).join('');upP.disabled=!d.repos.some(r=>r.behind)};
 $('#up-chk',b).onclick=async()=>{upB.className='empty';upB.textContent='GitHub tekshirilmoqda…';try{drawUp(await api('/api/admin/update'))}catch(e){upB.className='';upB.innerHTML=`<div class="err" style="margin:10px 14px">${esc(e.message)}</div>`}};
 upP.onclick=async()=>{upP.disabled=true;upP.textContent='Yuklanmoqda…';try{const r=await api('/api/admin/update/pull',{});upB.className='';upB.innerHTML=`<div style="padding:10px 14px;font-size:12px"><b>AppWin:</b> ${r.appwin.ok?'<span class="pill ok">✓</span>':'<span class="pill bad">✕</span>'} <span class="mono">${esc((r.appwin.out||r.appwin.error||'').slice(0,300))}</span><div style="margin-top:8px;color:var(--ink2)">Yangi kod ishga tushishi uchun «Qayta ishga tushirish» bosing.</div></div>`;toast('Yuklab olindi')}catch(e){toast(e.message,true)}upP.textContent='Yangilash (git pull)'};
 $('#up-rst',b).onclick=async()=>{if(!confirm('Dastur qayta ishga tushadi. Tizimdagi xodimlar 5–10 soniya kutadi. Davom etilsinmi?'))return;try{await api('/api/admin/restart',{});upB.className='empty';upB.textContent='Qayta ishga tushmoqda… 10 soniyadan keyin sahifani yangilang.';setTimeout(()=>location.reload(),9000)}catch(e){toast(e.message,true)}};
 $('#bn',b).onclick=async()=>{try{const r=await api('/api/backups/create',{});toast('Zaxira olindi: '+r.name);server(b)}catch(e){toast(e.message,true)}};
 const xr=$('#xr',b);if(xr)xr.onclick=async()=>{xr.disabled=true;xr.textContent='Zaxiralanmoqda…';try{const r=await api('/api/admin/backup/run',{});toast(`Zaxira olindi: ${r.name} · ${r.mb} MB`);server(b)}catch(e){toast(e.message,true);xr.disabled=false;xr.textContent='Hozir zaxiralash'}};
 const xv=$('#xv',b);if(xv)xv.onclick=async()=>{xv.disabled=true;try{const r=await api('/api/admin/backup/verify',{});const same=JSON.stringify(r.live)===JSON.stringify(r.backup);$('#xo',b).innerHTML=`<b>${esc(r.name.replace('_',' '))}</b> — butunlik: <b style="color:${r.integrity==='ok'?'var(--ok-ink)':'var(--bad)'}">${esc(r.integrity)}</b> · korxona ${r.backup.companies}/${r.live.companies} · GTD ${r.backup.gtd_rows}/${r.live.gtd_rows} · items ${r.backup.items}/${r.live.items} · vazifa ${r.backup.issues}/${r.live.issues} ${same?'<span class="pill ok">jonli baza bilan teng</span>':'<span class="pill warn">farq bor</span>'}`}catch(e){toast(e.message,true)}xv.disabled=false}}
function pwdModal(force){modal(`<div class="hd"><h2>${force?'Yangi parol o\'rnating':'Parolni o\'zgartirish'}</h2>${force?'':'<button class="x" data-x>×</button>'}</div><div class="bd"><div class="err" id="pe" hidden></div>${force?'':'<label class="fld">Joriy parol<input type="password" id="po"></label>'}<label class="fld">Yangi parol<input type="password" id="pn" placeholder="kamida 6 belgi"></label><label class="fld">Takror<input type="password" id="pn2"></label></div><div class="ft">${force?'':'<button class="btn" data-x>Bekor</button>'}<button class="btn p" id="ps">Saqlash</button></div>`,m=>{const save=async()=>{const n=$('#pn',m).value;if(n!==$('#pn2',m).value){const e=$('#pe',m);e.textContent='Parollar mos emas';e.hidden=false;return}try{await api('/api/auth/password',{old:force?'':$('#po',m).value,new:n});toast('Parol o\'zgartirildi');m.remove()}catch(e){const er=$('#pe',m);er.textContent=e.message;er.hidden=false}};$('#ps',m).onclick=save;m.addEventListener('keydown',e=>{if(e.key==='Enter')save()});setTimeout(()=>$(force?'#pn':'#po',m).focus(),50)})}
(async()=>{const d=await api('/api/auth/me');if(!d.user){location.href='/login';return}Object.assign(ME,d.user);$('#me').textContent=ME.name+' · '+ME.role_name;if(ME.role!=='superadmin'){location.href='/';return}
 $$('#tabs button').forEach(b=>b.onclick=()=>{A.tab=b.dataset.t;tab()});$('#add').onclick=()=>userModal(null);$('#pwd').onclick=()=>pwdModal(false);
 const h=location.hash.slice(1);if(['users','online','audit','server'].includes(h))A.tab=h;tab();if(ME.must_change)pwdModal(true)})();
